<svg width="100%" viewBox="0 0 215 60" role="img" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">COLORIST logo — primary color wordmark</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Comic-book brand logo with ink nib icon and COLORIST wordmark in solid primary red with black outline.</desc>

  <defs>
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#FFD500"/>
    </pattern>
    <clipPath id="panel-clip">
      <rect x="8" y="8" width="38" height="38" rx="3" transform="rotate(12 27 27)"/>
    </clipPath>
  </defs>

  <!-- ═══ ICON ═══ -->
  <rect x="12" y="12" width="38" height="38" rx="3" fill="#000000" transform="rotate(12 31 31)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="8" y="8" width="38" height="38" rx="3" fill="#E50000" stroke="#000000" stroke-width="3.5" transform="rotate(12 27 27)" style="fill:rgb(229, 0, 0);stroke:rgb(0, 0, 0);color:rgb(255, 255, 255);stroke-width:3.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="8" y="8" width="38" height="38" fill="url(#dots)" clip-path="url(#panel-clip)" transform="rotate(12 27 27)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="8" y="8" width="18" height="18" rx="2" fill="#FFD500" opacity="0.85" clip-path="url(#panel-clip)" transform="rotate(12 27 27)" style="fill:rgb(255, 213, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.85;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="8" y="8" width="38" height="38" rx="3" fill="none" stroke="#000000" stroke-width="3.5" transform="rotate(12 27 27)" style="fill:none;stroke:rgb(0, 0, 0);color:rgb(255, 255, 255);stroke-width:3.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="42" cy="46" rx="10" ry="7" fill="#000000" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="40" cy="44" rx="10" ry="7" fill="#FFD500" stroke="#000000" stroke-width="3" style="fill:rgb(255, 213, 0);stroke:rgb(0, 0, 0);color:rgb(255, 255, 255);stroke-width:3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="40" cy="44" r="3.5" fill="#E50000" style="fill:rgb(229, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <polygon points="35,40 46,36 48,48" fill="#000000" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <polygon points="36,41 45,37.5 47,47" fill="#FFD500" stroke="#000000" stroke-width="2" stroke-linejoin="round" style="fill:rgb(255, 213, 0);stroke:rgb(0, 0, 0);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ═══ WORDMARK ═══ -->

  <!-- Red drop shadow (+3,+3) -->
  <text x="63" y="46" font-family="Impact,'Arial Narrow',Haettenschweiler,sans-serif" font-size="32" font-weight="900" letter-spacing="1.5" fill="#E50000" style="text-rendering:geometricPrecision;fill:rgb(229, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Impact, &quot;Arial Narrow&quot;, Haettenschweiler, sans-serif;font-size:32px;font-weight:900;text-anchor:start;dominant-baseline:auto">COLORIST</text>

  <!-- White backing stroke for dark bg legibility -->
  <text x="60" y="43" font-family="Impact,'Arial Narrow',Haettenschweiler,sans-serif" font-size="32" font-weight="900" letter-spacing="1.5" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round" style="text-rendering:geometricPrecision;fill:none;stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:5px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:Impact, &quot;Arial Narrow&quot;, Haettenschweiler, sans-serif;font-size:32px;font-weight:900;text-anchor:start;dominant-baseline:auto">COLORIST</text>

  <!-- Black outline -->
  <text x="60" y="43" font-family="Impact,'Arial Narrow',Haettenschweiler,sans-serif" font-size="32" font-weight="900" letter-spacing="1.5" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" style="text-rendering:geometricPrecision;fill:none;stroke:rgb(0, 0, 0);color:rgb(255, 255, 255);stroke-width:4px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:Impact, &quot;Arial Narrow&quot;, Haettenschweiler, sans-serif;font-size:32px;font-weight:900;text-anchor:start;dominant-baseline:auto">COLORIST</text>

  <!-- Primary color fill — Signal Red -->
  <text x="60" y="43" font-family="Impact,'Arial Narrow',Haettenschweiler,sans-serif" font-size="32" font-weight="900" letter-spacing="1.5" fill="#E50000" style="text-rendering:geometricPrecision;fill:rgb(229, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Impact, &quot;Arial Narrow&quot;, Haettenschweiler, sans-serif;font-size:32px;font-weight:900;text-anchor:start;dominant-baseline:auto">COLORIST</text>

</svg>