<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorist - 404 Panel Missing</title>
  <meta name="description" content="Page not found.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .error-panel {
      position: relative;
      border: 6px solid var(--color-ink);
      padding: var(--spacing-6);
      background: var(--color-bg);
      transform: rotate(-2deg);
      box-shadow: 15px 15px 0px var(--color-primary);
      max-width: 600px;
      margin: 0 auto;
      overflow: hidden;
    }
    .error-panel::after {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      width: 10px;
      height: 120%;
      background: var(--color-bg);
      transform: rotate(15deg);
      border-left: 3px dashed var(--color-ink);
      border-right: 3px dashed var(--color-ink);
    }
    .error-number {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 20vw, 12rem);
      color: var(--color-bg);
      text-shadow: 
        -4px -4px 0 var(--color-ink),
         4px -4px 0 var(--color-ink),
        -4px  4px 0 var(--color-ink),
         4px  4px 0 var(--color-ink),
         8px  8px 0 var(--color-primary);
      line-height: 1;
      margin: 0;
      position: relative;
      z-index: 2;
    }
    .error-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        45deg,
        var(--color-secondary),
        var(--color-secondary) 10px,
        var(--color-bg) 10px,
        var(--color-bg) 20px
      );
      opacity: 0.3;
      z-index: 0;
    }
  </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; background: var(--color-surface-ink);">
  
  <div class="texture-halftone" style="opacity: 0.05;"></div>

  <main style="width: 100%; padding: var(--spacing-4); text-align: center; position: relative; z-index: 2; margin: 0;">
    <div class="error-panel animate-panel-reveal">
      <div class="error-bg"></div>
      <h1 class="error-number">404</h1>
      <div style="position: relative; z-index: 2; background: var(--color-bg); padding: var(--spacing-2); border: var(--border-ink); display: inline-block; transform: rotate(2deg); margin-top: -20px;">
        <h2 style="font-family: var(--font-heading); font-size: 2.5rem; margin: 0; color: var(--color-primary);">PANEL MISSING!</h2>
      </div>
      <p style="font-size: 1.2rem; font-weight: bold; position: relative; z-index: 2; margin-top: var(--spacing-4);">It looks like the inker forgot to draw this page.</p>
    </div>

    <div class="mt-8 animate-slide-up" style="animation-delay: 0.3s;">
      <a href="index.html" class="btn"><i class="ph ph-arrow-left" style="margin-right: 8px;"></i> Return to Start</a>
    </div>
  </main>

  <script>
    // Inherit theme from localStorage
    const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (currentTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    const currentDir = localStorage.getItem('dir') || 'ltr';
    if (currentDir === 'rtl') {
      document.documentElement.setAttribute('dir', 'rtl');
    }
  </script>
</body>
</html>
